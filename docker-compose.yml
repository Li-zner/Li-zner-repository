x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ===== 网关实例 1 =====
  gateway:
    image: agent_gateway-gateway:latest
    logging: *default-logging
    container_name: agent_gateway
    ports:
      - "10092:10086"
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    command: >
      python -m uvicorn app.main:app --host 0.0.0.0 --port 10086 --loop uvloop --backlog 1024
    volumes:
      - ./static:/app/static
      - ./tests:/app/tests
      - ./cdc_journal:/app/cdc_journal
    restart: unless-stopped
    networks:
      - docker_default
      - gateway_net

  gateway2:
    image: agent_gateway-gateway:latest
    container_name: agent_gateway2
    logging: *default-logging
    ports:
      - "10089:10086"
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    command: >
      python -m uvicorn app.main:app --host 0.0.0.0 --port 10086 --loop uvloop --backlog 1024
    volumes:
      - ./static:/app/static
      - ./tests:/app/tests
      - ./cdc_journal:/app/cdc_journal
    restart: unless-stopped
    networks:
      - docker_default
      - gateway_net

  gateway3:
    image: agent_gateway-gateway:latest
    container_name: agent_gateway3
    logging: *default-logging
    ports:
      - "10093:10086"
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    command: >
      python -m uvicorn app.main:app --host 0.0.0.0 --port 10086 --loop uvloop --backlog 1024
    volumes:
      - ./static:/app/static
      - ./tests:/app/tests
      - ./cdc_journal:/app/cdc_journal
    restart: unless-stopped
    networks:
      - docker_default
      - gateway_net

  gateway4:
    image: agent_gateway-gateway:latest
    container_name: agent_gateway4
    logging: *default-logging
    ports:
      - "10094:10086"
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    command: >
      python -m uvicorn app.main:app --host 0.0.0.0 --port 10086 --loop uvloop --backlog 1024
    volumes:
      - ./static:/app/static
      - ./tests:/app/tests
      - ./cdc_journal:/app/cdc_journal
    restart: unless-stopped
    networks:
      - docker_default
      - gateway_net

  nginx:
    image: nginx:alpine
    container_name: nginx_lb
    logging: *default-logging
    ports:
      - "10090:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway:
        condition: service_started
      gateway2:
        condition: service_started
      gateway3:
        condition: service_started
      gateway4:
        condition: service_started
    networks:
      - gateway_net

  # ===== 监控服务 =====
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    logging: *default-logging
    ports:
      - "9090:9090"
    volumes:
    - ./prometheus.yml:/etc/prometheus/prometheus.yml
    - ./alert.rules.yml:/etc/prometheus/alert.rules.yml
    restart: unless-stopped
    networks:
      - gateway_net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    logging: *default-logging
    ports:
      - "13101:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    # 管理员密码从安全目录 .env 注入（键名 GF_SECURITY_ADMIN_PASSWORD），
    # 不再硬编码进 compose（密钥治理：凭据一律走安全目录，2026-08-16 修复）
    env_file:
      - ../.env
    networks:
      - gateway_net
    depends_on:
      - loki
      - tempo

  loki:
    image: grafana/loki:latest
    container_name: loki
    logging: *default-logging
    ports:
      - "13100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - gateway_net

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    logging: *default-logging
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./loki/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - gateway_net

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    logging: *default-logging
    user: root
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./tempo-config.yaml:/etc/tempo.yaml
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200"
    restart: unless-stopped
    networks:
      - gateway_net

  redis:
    image: redis:7-alpine
    container_name: redis
    logging: *default-logging
    restart: unless-stopped
    #ports:
    #  - "6379:6379"
    networks:
      - gateway_net
      - docker_default
  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres
    logging: *default-logging
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: agent_user
      POSTGRES_DB: agent_gateway
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gateway_net
      - docker_default
    # 放开连接限制以支持 4 实例 × 50 连接池；加载 pg_stat_statements（慢查询监控）
    command: >
      postgres -c max_connections=300 -c shared_buffers=1GB -c effective_cache_size=3GB
      -c shared_preload_libraries=pg_stat_statements

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    logging: *default-logging
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
    restart: unless-stopped
    networks:
      - gateway_net

networks:
  docker_default:
    external: true
  gateway_net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  tempo_data:
  postgres_data: