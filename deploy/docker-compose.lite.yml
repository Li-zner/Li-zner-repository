# 精简版 docker-compose —— 阿里云小实例（单网关 + nginx，面试/稳定用）
# 只跑自研：gateway×1 + postgres + redis + nginx；去掉监控栈与 Dify 相关。
# 用法：docker compose -f deploy/docker-compose.lite.yml up -d

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "5m"
    max-file: "2"

services:
  gateway:
    image: agent_gateway-gateway:lite
    logging: *default-logging
    container_name: agent_gateway
    env_file:
      - .env.lite
    environment:
      - REDIS_URL=redis://redis:6379/0
    # 启动前先执行数据库迁移（幂等，已在 head 时自动跳过）；失败则容器退出由 restart 拉起重试
    command: ["sh", "-c", "alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port 10086 --loop uvloop --backlog 1024"]
    # CDC 审计 JSONL 落宿主机：容器重建/升级不再丢失审计镜像与 checkpoint
    # （首次挂载为空目录时，worker 会从 cdc_events 表重放导出，事件不丢）
    volumes:
      - ./cdc_journal_lite:/app/cdc_journal
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: nginx_lb
    logging: *default-logging
    ports:
      - "10090:80"
    volumes:
      - ./nginx.conf.lite:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway
    restart: unless-stopped
    mem_limit: 64m

  redis:
    image: redis:7-alpine
    container_name: redis
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 128m

  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres
    logging: *default-logging
    restart: unless-stopped
    env_file:
      - .env.lite
    environment:
      POSTGRES_USER: agent_user
      POSTGRES_DB: agent_gateway
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_user -d agent_gateway"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 256m

volumes:
  postgres_data:
