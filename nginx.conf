# ============================================================
# agent_gateway Nginx 配置（负载均衡 + 安全加固/WAF）
# 注意：此文件由 docker-compose 挂载进 nginx_lb 容器
# ============================================================

# ---------- 简易 WAF：恶意请求特征（map 在 http 上下文） ----------
# 命中特征直接 403，不打到后端网关
map $request_uri $is_attack {
    default 0;
    # SQL 注入特征
    ~*(union\s+(all\s+)?select) 1;
    ~*(select\s+.*\s+from\s+.*\s+where) 1;
    ~*(insert\s+into|delete\s+from|drop\s+table|update\s+.*\s+set) 1;
    ~*(information_schema|pg_sleep|benchmark\s*\() 1;
    # XSS 特征
    ~*(<script|javascript:|onerror\s*=|onload\s*=|alert\s*\() 1;
    # 路径穿越 / 常见攻击载荷
    ~*(\.\./|\.\.\\|/etc/passwd|base64_encode|eval\s*\() 1;
}

# ---------- 限流区（http 上下文定义） ----------
# 全局限流：每 IP 500r/s 突发 1000（仅作 DDoS 盾牌，阈值高不影响正常/压测）
limit_req_zone $binary_remote_addr zone=gw_limit:10m rate=500r/s;
# 认证接口限流：每 IP 50r/s（防撞库/暴力破解；仍允许压测登录）
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=50r/s;
# 并发连接限制：每 IP 最多 100（防连接耗尽）
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

upstream gateway_cluster {
    # 负载均衡：默认轮询
    # ⚠️ 本 upstream 由 autoscale.sh 动态维护（与运行实例同步）：
    #    扩容时在 base 行后追加 server，缩容时删除对应 server，然后 reload。
    #    不要手工增删（Docker DNS 不解析已停服务，nginx reload 会失败）。
    server agent_gateway:10086 max_fails=3 fail_timeout=30s;
    server agent_gateway2:10086 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_tokens off;                  # 隐藏 Nginx 版本号
    client_max_body_size 20m;           # 限制上传体积（文件上传功能）

    # 安全响应头（基础防线）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # 简易 WAF：命中攻击特征直接 403
    if ($is_attack = 1) {
        return 403;
    }

    # 并发连接限制
    limit_conn conn_limit 100;

    # ===== 健康检查端点（供 Prometheus / K8s 探针使用）=====
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # ===== 认证接口（严格限流，防撞库/暴力破解）=====
    location ~ ^/(api/login|api/phone/|auth/github) {
        limit_req zone=auth_limit burst=100 nodelay;
        proxy_pass http://gateway_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # 后端失败快速切换（实例可能被 autoscaler 停掉，需全量重试）
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 4;
        proxy_next_upstream_timeout 10s;
    }

    # ===== 静态资源走集群（两个实例都能服务）=====
    location /static/ {
        proxy_pass http://gateway_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 静态资源可以缓存
        proxy_buffering on;
        expires 1h;
        proxy_connect_timeout 2s;
        # 后端失败快速切换（实例可能被 autoscaler 停掉）
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 4;
        proxy_next_upstream_timeout 10s;
    }

    # ===== 主路由 =====
    location / {
        limit_req zone=gw_limit burst=1000 nodelay;
        proxy_pass http://gateway_cluster;

        # 基础代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式响应必须禁用缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 超时配置
        proxy_connect_timeout 2s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # 后端失败时自动切换（全量重试，实例数由 autoscaler 动态增减）
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 4;
        proxy_next_upstream_timeout 10s;
    }
}