# ============================================================
# 项目编排骨架（复制到项目根目录后按 04-待人类填写/项目协议 修改）
# 服务名建议：app / postgres / redis / nginx
# 密钥体系：env_file 指向安全目录（Windows 用 UNC，Linux 用 POSIX）
# ============================================================
services:
  app:
    image: <project>-app:latest
    container_name: <project>_app
    build:
      context: .
      dockerfile: Dockerfile
    logging: &default-logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "8081:8000"          # 宿主机端口:容器内端口（按协议表改）
    env_file:
      - '\\wsl.localhost\Ubuntu\etc\<project>\.env'   # Windows UNC
      # - /etc/<project>/.env                          # Linux
    environment:
      - REDIS_URL=redis://redis:6379/0
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    networks:
      - app_net

  postgres:
    image: postgres:16
    container_name: <project>_postgres
    logging: *default-logging
    restart: unless-stopped
    env_file:
      - '\\wsl.localhost\Ubuntu\etc\<project>\.env'
    environment:
      POSTGRES_USER: app_user
      POSTGRES_DB: app_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app_net

  redis:
    image: redis:7-alpine
    container_name: <project>_redis
    logging: *default-logging
    restart: unless-stopped
    networks:
      - app_net

  nginx:
    image: nginx:alpine
    container_name: <project>_nginx
    logging: *default-logging
    ports:
      - "8090:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - app
    networks:
      - app_net

volumes:
  pg_data:

networks:
  app_net:
    driver: bridge
