# 本地隔离轻服务栈 —— 用于测试重构后的代码，不触碰现有 agent_gateway 项目。
# 用唯一 project（agentlite）+ 唯一容器名，绑定 10095（10090 归 full 版 nginx_lb；2026-09-05 解决双栈端口冲突）。
# 用法：docker compose -f deploy/docker-compose.lite.local.yml up -d
#       docker exec agent_gateway_lite alembic upgrade head   # 全新 postgres_lite 建表
name: agentlite

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "5m"
    max-file: "2"

services:
  gateway:
    image: agent_gateway-gateway:lite
    logging: *default-logging
    container_name: agent_gateway_lite
    env_file:
      - .env.lite
    environment:
      - REDIS_URL=redis://redis:6379/0
    command: >
      python -m uvicorn app.main:app --host 0.0.0.0 --port 10086 --loop uvloop --backlog 1024
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: nginx_lb_lite
    logging: *default-logging
    ports:
      - "10095:80"
    volumes:
      - ./nginx.conf.lite.local:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway
    restart: unless-stopped
    mem_limit: 64m

  redis:
    image: redis:7-alpine
    container_name: redis_lite
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 128m

  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres_lite
    logging: *default-logging
    restart: unless-stopped
    env_file:
      - .env.lite
    environment:
      POSTGRES_USER: agent_user
      POSTGRES_DB: agent_gateway
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_user -d agent_gateway"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_lite_data:/var/lib/postgresql/data
    mem_limit: 256m

volumes:
  postgres_lite_data:
